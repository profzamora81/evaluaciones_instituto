<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluaciones III Unidad - Primer Parcial</title>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --error-color: #ef4444;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container { 
            background-color: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
        }

        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: #111827;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            margin-top: 15px; 
            transition: background-color 0.3s;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }

        .error-message { 
            color: white; 
            background-color: var(--error-color); 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            text-align: center; 
            margin-bottom: 20px; 
            display: none; 
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Acceso a Evaluación</h2>
    
    <div id="mensajeError" class="error-message">
        Código de acceso incorrecto.
    </div>

    <form id="evaluationForm">
        
        <!-- Selección de Carrera / Orientación -->
        <div class="form-group">
            <label for="orientacion">Carrera / Especialidad:</label>
            <select id="orientacion" required>
                <option value="">Selecciona tu carrera...</option>
                <option value="Computacion">Computación</option>
                <option value="Diseno">Diseño</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Mecanica">Mecánica</option>
            </select>
        </div>

        <!-- Selección de Grado (coincidente con tus carpetas 4to y 5to) -->
        <div class="form-group">
            <label for="grado">Grado:</label>
            <select id="grado" required>
                <option value="">Selecciona tu grado...</option>
                <option value="4to">4to Año</option>
                <option value="5to">5to Año</option>
            </select>
        </div>

        <div class="form-group">
            <label for="codigo">Código de Evaluación:</label>
            <input type="password" id="codigo" placeholder="Ingresa el código brindado por el docente" required>
        </div>

        <button type="submit">Ingresar a la Evaluación</button>
    </form>
</div>

<script>
    document.getElementById('evaluationForm').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const orientacion = document.getElementById('orientacion').value;
        const grado = document.getElementById('grado').value;
        const codigoIngresado = document.getElementById('codigo').value;
        const mensajeError = document.getElementById('mensajeError');

        const CODIGO_CORRECTO = "parcial3"; 

        if (codigoIngresado === CODIGO_CORRECTO) {
            mensajeError.style.display = 'none';
            
            // Construye la ruta exacta basada en tu estructura: ./Computacion/4to/index.html
            const rutaDestino = `./${orientacion}/${grado}/index.html`;
            
            window.location.href = rutaDestino;
        } else {
            mensajeError.style.display = 'block';
            document.getElementById('codigo').value = '';
            document.getElementById('codigo').focus();
        }
    });
</script>

</body>
</html>
