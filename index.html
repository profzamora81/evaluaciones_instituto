<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluaciones III Unidad - Primer Parcial</title>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --text-color: #1f2937;
            --error-color: #ef4444;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container { 
            background-color: #ffffff; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
        }

        h2 { 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: #111827;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            margin-top: 15px; 
            transition: background-color 0.3s;
        }

        button:hover { 
            background-color: var(--primary-hover); 
        }

        .error-message { 
            color: white; 
            background-color: var(--error-color); 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            text-align: center; 
            margin-bottom: 20px; 
            display: none; /* Oculto por defecto */
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Acceso a Evaluación</h2>
    
    <div id="mensajeError" class="error-message">
        Código de acceso incorrecto.
    </div>

    <form id="evaluationForm">
        
        <div class="form-group">
            <label for="grado">Grado:</label>
            <select id="grado" required>
                <option value="">Selecciona tu grado...</option>
                <!-- CORRECCIÓN: El value debe ser el nombre COMPLETO de la carpeta -->
                <option value="Bachillerato_en_ciencias_con_orientacion">Bachillerato en Ciencias</option>
            </select>
        </div>

        <div class="form-group">
            <label for="orientacion">Orientación:</label>
            <select id="orientacion" required>
                <option value="">Selecciona tu orientación...</option>
                <!-- Los values coinciden exactamente con tus subcarpetas -->
                <option value="Computacion">Computación</option>
                <option value="Diseno">Diseño</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Mecanica">Mecánica</option>
            </select>
        </div>

        <div class="form-group">
            <label for="codigo">Código de Evaluación:</label>
            <input type="password" id="codigo" placeholder="Ingresa el código brindado por el docente" required>
        </div>

        <button type="submit">Ingresar a la Evaluación</button>
    </form>
</div>

<script>
    document.getElementById('evaluationForm').addEventListener('submit', function(event) {
        // Prevenir que el formulario recargue la página
        event.preventDefault(); 

        // 1. Obtener los valores ingresados por el estudiante
        const grado = document.getElementById('grado').value;
        const orientacion = document.getElementById('orientacion').value;
        const codigoIngresado = document.getElementById('codigo').value;
        const mensajeError = document.getElementById('mensajeError');

        // 2. Definir el código maestro para el examen (Puedes cambiarlo aquí)
        const CODIGO_CORRECTO = "parcial2026"; 

        // 3. Validar el código
        if (codigoIngresado === CODIGO_CORRECTO) {
            // Ocultar error si estaba visible
            mensajeError.style.display = 'none';
            
            // 4. Construir la ruta basada en las carpetas seleccionadas
            // Quedará como: ./Bachillerato_en_ciencias_con_ori/Computacion/index.html
            const rutaDestino = `./${grado}/${orientacion}/index.html`;
            
            // 5. Redirigir al estudiante a su examen
            window.location.href = rutaDestino;
        } else {
            // Mostrar mensaje de error y limpiar el campo de código
            mensajeError.style.display = 'block';
            document.getElementById('codigo').value = '';
            document.getElementById('codigo').focus();
        }
    });
</script>

</body>
</html>
